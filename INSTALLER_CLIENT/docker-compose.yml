services:
  postgres:
    image: postgres:16-alpine
    container_name: pesanrahasia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:-postgres}
      POSTGRES_DB: ${PGDATABASE:-pesan_rahasia}
    ports:
      - "${PGPORT_EXTERNAL:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-pesan_rahasia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: pesanrahasia:local
    container_name: pesanrahasia_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-3006}:3006"
    env_file:
      - .env
    environment:
      PORT: 3006
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://message.vocpos.id}
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      PGDATABASE: ${PGDATABASE:-pesan_rahasia}
      STORE_NAME: ${STORE_NAME:-PesanRahasia VOCPOS}
      VOCML_ENABLED: ${VOCML_ENABLED:-true}
      VOCML_SERVER_URL: ${VOCML_SERVER_URL:-https://vocml.vocpos.id}
      VOCML_PRODUCT: ${VOCML_PRODUCT:-messagerahasia}
      FREE_TRIAL_LIMIT: ${FREE_TRIAL_LIMIT:-3}
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3006/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: pesanrahasia_tunnel
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate --url http://app:3006 run --token eyJhIjogImRiYTRiYzZkNTU0Yjg5ODYyNjBjYTI3ZGU4MDdlMDUyIiwgInQiOiAiNmViNzNkYTYtNmNiZS00ZTA4LWJiMGMtNDg1MjBmN2ZlOWMxIiwgInMiOiAiM3M2aW53RkNFSXpZOUJiSmdFQXJiRWYremRtd2hHNDhFQjdTZ2kybDRtQT0ifQ==

volumes:
  pgdata:

